[package]
name = "cmdinput"
version = "1.0.0"
edition = "2021"
description = "KeyFlux-CommandInput: KeyFlux command input window (class MyKeymap_Command_Input) rewritten in Rust. Drop-in replacement when deployed as KeyFlux-CommandInput.exe."
# 非发布物（与 config-ui-reactor 同口径）：本 crate 只随 KeyFlux 分发、不单独上 crates.io。
# 另：cargo-deny（报告 #8）对「非 private 且无 license」的根 crate 报 `unlicensed` ——
# 置 private 后由 `[licenses] private = { ignore = true }` 豁免（其自身许可即仓库 GPL-3.0，
# 不应进入「依赖允许清单」）。若将来要单独发布，请改回并补 license 字段 + 许可例外。
publish = false

[lib]
name = "cmdinput"
path = "src/lib.rs"

[[bin]]
name = "keyflux-command-input"
path = "src/main.rs"

[dependencies]
# windows crate (design-C §3): 唯一第三方依赖; 0.62.2 为本机缓存实测可用版本。
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
lto = true

# 与 config-ui-reactor 同口径的 clippy 门禁（2026-10-09）：本 crate 装着全部 Win32 unsafe
# 并产出正式发布的 bin/KeyFlux-CommandInput.exe，此前**零闸门**。
# 注：**不**设 `unsafe_code = "warn"` —— 本 crate 的职责就是封装 Win32，全部调用点都写
#     `unsafe`，设 warn 等于对整库报错（config-ui-reactor 那样把 unsafe 收在叶层才适用）。
#     unsafe 的正确性由每处的 `// SAFETY:` 注释负责，而非 lint 禁止。
[lints.clippy]
all = "warn"
# pedantic 项：函数长度门禁，阈值 = 默认 100（与 config-ui-reactor 一致）。
too_many_lines = "warn"
