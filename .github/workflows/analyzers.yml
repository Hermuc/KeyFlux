name: analyzers

# 代码风格/静态闸门 —— 风格漂移与契约回归。
#
# 为什么**独立于 release.yml** (2026-09-16 建):
#   风格问题不该拦住发布 —— 本 workflow 只在 push / PR 上给红灯, 打 tag 出包不受影响。
#   对应地, release.yml 保持原样未动。
#
# 历史: 2026-09-16~09-27 期间是 .NET (config-ui-avalonia + KeyFlux.Settings.Tests) 的
#   dotnet format 闸门; 2026-09-28 Avalonia 客户端退役, 改为 Rust 侧三道闸门
#   (fmt --check / clippy -D warnings / cargo test), 与 Makefile 的 buildClientReactor
#   严格一致 —— 本地 `make analyzers` 复现前两道, `make buildClientReactor` 复现全部。
#   旧 C# 单测的契约覆盖已迁移为 config-ui-reactor 的 cargo 单测 (models/services)。
#
# 2026-09-30 审计补口 (P1「防流程腐化」):
#   - reactor-gates 不再内联 cargo 序列, 改为调用 tools/cargo-gates.ps1 (单一真源),
#     否则「闸门在本地与 CI 各写一份」必然漂移;
#   - 新增 lint / check-texttypes / api-parity 三个 job —— 这三个 make 目标此前在 CI
#     零引用: 其中 api-parity 是唯一同时覆盖「Go 基线漂移」与「Go/Rust 双实现分叉」的闸门,
#     躺在仓库里没人跑 (Makefile 里也刚补上同名目标)。
#
# 注: 本 workflow 假定 runner 自带 GNU make (windows-latest 镜像的 Build Tools 含 make),
#   lint / check-texttypes / api-parity job 直接复用 Makefile 目标, 避免把配方抄第二份。

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Rust/WinUI3 客户端 (config-ui-reactor) 三道闸门。
  # 说明: build.rs 的 windows_reactor_setup 在构建期会拉取 pinned Windows App Runtime
  #   (NuGet 缓存), GitHub 托管机自带网络与 MSVC, 无需额外准备。
  #   cargo-gates.ps1 自己切到 config-ui-reactor 目录, 故不需要 defaults.working-directory。
  #   刻意**不传** -EnvScript: config-ui-reactor/env.ps1 钉的是本机的 MSVC/SDK 路径,
  #   在 runner 上找不到会直接 throw (runner 的 cargo/rustc 本来就在 PATH 上)。
  reactor-gates:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust toolchain (version pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            config-ui-reactor/target
          key: cargo-${{ runner.os }}-${{ hashFiles('config-ui-reactor/Cargo.lock') }}

      - name: 'Cargo gates (fmt + clippy + test) -- single source: tools/cargo-gates.ps1'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/cargo-gates.ps1

  # 标识符冲突静态闸门 = `make lint`。
  #   AHK 大小写不敏感, 「局部变量遮蔽同名函数」是纯运行时崩溃, /Validate 查不出;
  #   扫描 bin/lib 下全部 AHK 源, 有 ERROR 即非零退出。
  lint:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: make lint
        run: make lint

  # 内置文本特征三端一致性闸门 = `make check-texttypes`。
  #   Go 注册表 ⇄ AHK TextFeatureSpecs ⇄ 共享向量 (值/大小写/正则/顺序 + 运行时逐字提取)。
  check-texttypes:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: make check-texttypes
        run: make check-texttypes

  # 生成端差分对账 (P0, docs/plan-rust-migration.md §4)。
  #   用当前构建的 settings.exe 复现 tools/parity/reference 的逐字节基线:
  #   P0 阶段守护「基准不漂移」(生成规则改动未重新录制 reference 即红);
  #   Rust 生成器接入后, 同一脚本即为 Go vs Rust 的等价性闸门。
  parity-gate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go (version pinned by config-server/go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: config-server/go.mod
          cache-dependency-path: config-server/go.sum

      - name: Build backend (settings.exe)
        working-directory: config-server
        run: go build -tags=nomsgpack -ldflags "-s -w -X settings/internal/script.KeyfluxVersion=ci" -o ../bin/settings.exe ./cmd/settings

      - name: Parity gate (reference reproduction)
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/parity/run_parity.ps1

  # API 级差分对账 (P0/P1) —— 唯一覆盖「Go 基线漂移 + Go/Rust 双实现分叉」的闸门。
  #   两侧各自 -Check 一次 (与本地 `make api-parity` 同一语义):
  #     [1] Go   : bin/settings.exe (make buildServer, 版本号取自 Makefile ⇒ 与基线一致)
  #     [2] Rust : config-ui-reactor/target/release/settings.exe
  #   脚本口径: 候选 exe 未实现的端点记 MISSING_ENDPOINT (不算工具失败), 字节不一致记
  #   MISMATCH (exit 1)。故 Rust 迁移未完成时本 job 仍可绿, 真正分叉才会红。
  #   ⚠️ 两个构建都必须注入 KEYFLUX_VERSION (GET /config 的 keyfluxVersion 字段在基线内),
  #      否则 step 2 会因版本串不同而报 MISMATCH —— 那是构建口径问题, 不是实现分叉。
  api-parity:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go (version pinned by config-server/go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: config-server/go.mod
          cache-dependency-path: config-server/go.sum

      - name: Setup Rust toolchain (version pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            config-ui-reactor/target
          key: cargo-${{ runner.os }}-${{ hashFiles('config-ui-reactor/Cargo.lock') }}

      - name: 'Read version (single source: Makefile)'
        id: ver
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' Makefile | head -1)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "KeyFlux version from Makefile: ${VERSION}"

      - name: Build Go settings.exe (version via ldflags, also stages bin/templates)
        run: make buildServer

      - name: Build Rust settings.exe (cargo gates + release, version via option_env!)
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/cargo-gates.ps1 -Release -Version ${{ steps.ver.outputs.version }}

      # 沙箱源树: bin/behaviors 与 data/config.json 已入库; bin/templates 由 buildServer 产出;
      # data/plugins 是忽略项 (部署/启动产物), 这里用官方示例插件补齐, 否则 GET /api/plugins
      # 会因「少一个内置插件」在 step 5 报 MISMATCH。
      - name: Stage plugin examples for the sandbox
        shell: bash  # `cp -r src/. dst` 是 POSIX 语义; Windows runner 缺省 shell 是
                     # pwsh, Copy-Item 对结尾的 `/.` 解析为空拷贝 (CI 实测 data/plugins
                     # 落空 -> GET /api/plugins 19/23 假红)。
        run: |
          mkdir -p data/plugins
          cp -r plugins/examples/. data/plugins/
          ls data/plugins

      - name: API parity [1/2] vs Go settings.exe
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/api-parity/run_api_parity.ps1 -Check -Exe bin/settings.exe

      - name: API parity [2/2] vs Rust settings.exe
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/api-parity/run_api_parity.ps1 -Check -Exe config-ui-reactor/target/release/settings.exe
