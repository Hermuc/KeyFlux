name: analyzers

# 代码风格/静态闸门 —— 风格漂移与契约回归。
#
# 为什么**独立于 release.yml** (2026-09-16 建):
#   风格问题不该拦住发布 —— 本 workflow 只在 push / PR 上给红灯, 打 tag 出包不受影响。
#   对应地, release.yml 保持原样未动。
#
# 历史: 2026-09-16~09-27 期间是 .NET (config-ui-avalonia + KeyFlux.Settings.Tests) 的
#   dotnet format 闸门; 2026-09-28 Avalonia 客户端退役, 改为 Rust 侧三道闸门
#   (fmt --check / clippy -D warnings / cargo test), 与 Makefile 的 buildClientReactor
#   严格一致 —— 本地 `make analyzers` 复现前两道, `make buildClientReactor` 复现全部。
#   旧 C# 单测的契约覆盖已迁移为 config-ui-reactor 的 cargo 单测 (models/services)。
#
# 2026-09-30 审计补口 (P1「防流程腐化」):
#   - reactor-gates 不再内联 cargo 序列, 改为调用 tools/cargo-gates.ps1 (单一真源),
#     否则「闸门在本地与 CI 各写一份」必然漂移;
#   - 新增 lint / check-texttypes / api-parity 三个 job —— 这三个 make 目标此前在 CI
#     零引用: 其中 api-parity 是唯一同时覆盖「Go 基线漂移」与「Go/Rust 双实现分叉」的闸门,
#     躺在仓库里没人跑 (Makefile 里也刚补上同名目标)。
# 2026-10-06 Go 后端退役: parity-gate / api-parity 的 Go 构建腿 (setup-go + go build)
#   删除, settings.exe 统一由 cargo 产出 (config-ui-reactor bin 目标); api-parity 收敛为
#   "Rust 实现 vs Go 时代冻结基线" 的单实现口径。
#
# 注: 本 workflow 假定 runner 自带 GNU make (windows-latest 镜像的 Build Tools 含 make),
#   lint / check-texttypes / api-parity job 直接复用 Makefile 目标, 避免把配方抄第二份。

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Rust/WinUI3 客户端 (config-ui-reactor) 三道闸门。
  # 说明: build.rs 的 windows_reactor_setup 在构建期会拉取 pinned Windows App Runtime
  #   (NuGet 缓存), GitHub 托管机自带网络与 MSVC, 无需额外准备。
  #   cargo-gates.ps1 自己切到 config-ui-reactor 目录, 故不需要 defaults.working-directory。
  #   刻意**不传** -EnvScript: config-ui-reactor/env.ps1 钉的是本机的 MSVC/SDK 路径,
  #   在 runner 上找不到会直接 throw (runner 的 cargo/rustc 本来就在 PATH 上)。
  reactor-gates:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust toolchain (version pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            config-ui-reactor/target
          key: cargo-${{ runner.os }}-${{ hashFiles('config-ui-reactor/Cargo.lock') }}

      - name: 'Cargo gates (fmt + clippy + test) -- single source: tools/cargo-gates.ps1'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/cargo-gates.ps1

  # 标识符冲突静态闸门 = `make lint`。
  #   AHK 大小写不敏感, 「局部变量遮蔽同名函数」是纯运行时崩溃, /Validate 查不出;
  #   扫描 bin/lib 下全部 AHK 源, 有 ERROR 即非零退出。
  lint:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: make lint
        run: make lint

  # 内置文本特征三端一致性闸门 = `make check-texttypes`。
  #   Go 注册表 ⇄ AHK TextFeatureSpecs ⇄ 共享向量 (值/大小写/正则/顺序 + 运行时逐字提取)。
  check-texttypes:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: make check-texttypes
        run: make check-texttypes

  # 生成端差分对账 (P0, docs/plan-rust-migration.md §4)。
  #   用当前构建的 settings.exe (Rust —— 2026-10-06 Go 后端退役后唯一实现) 复现
  #   tools/parity/reference 的逐字节基线 (录制自 Go 版, 现为冻结契约):
  #   生成规则改动未重新录制 reference 即红。
  parity-gate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust toolchain (version pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            config-ui-reactor/target
          key: cargo-${{ runner.os }}-${{ hashFiles('config-ui-reactor/Cargo.lock') }}

      - name: 'Build settings.exe (cargo gates + release)'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/cargo-gates.ps1 -Release

      # 消费方按**文件名**调用 bin\settings.exe (对账脚本缺省亦然), 先按名落位
      - name: Stage settings.exe to bin/ (by-name contract)
        shell: pwsh
        run: |
          Copy-Item "config-ui-reactor/target/release/settings.exe" "bin/settings.exe" -Force
          if (!(Test-Path "bin/settings.exe")) { Write-Error "missing bin/settings.exe"; exit 1 }

      - name: Parity gate (reference reproduction)
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/parity/run_parity.ps1

  # API 级差分对账 (P0/P1) —— 唯一覆盖「基线漂移 vs 实现分叉」的闸门。
  #   2026-10-06 Go 后端退役后收敛为单实现口径: 用 Rust settings.exe 对
  #   tools/api-parity/reference (录制自 Go 版的冻结契约快照) 做 -Check;
  #   脚本口径: 候选 exe 未实现的端点记 MISSING_ENDPOINT (不算工具失败), 字节不一致记
  #   MISMATCH (exit 1)。
  #   ⚠️ settings.exe 必须带 KEYFLUX_VERSION 构建 (option_env! 注入), 否则 GET /config 的
  #      keyfluxVersion 字段与基线不同字节 ⇒ step 2 会因版本串不同报 MISMATCH —— 那是
  #      构建口径问题, 不是实现分叉。
  api-parity:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust toolchain (version pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            config-ui-reactor/target
          key: cargo-${{ runner.os }}-${{ hashFiles('config-ui-reactor/Cargo.lock') }}

      - name: 'Read version (single source: Makefile)'
        id: ver
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' Makefile | head -1)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "KeyFlux version from Makefile: ${VERSION}"

      - name: 'Build settings.exe (cargo gates + release, version via option_env!)'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/cargo-gates.ps1 -Release -Version ${{ steps.ver.outputs.version }}

      # 沙箱源树: bin/behaviors 与 data/config.json 已入库; bin/templates 由
      # sync-templates 产出 (2026-10-06 Go buildServer 退役后的等价目标);
      # data/plugins 是忽略项 (部署/启动产物), 这里用官方示例插件补齐, 否则 GET /api/plugins
      # 会因「少一个内置插件」在 step 5 报 MISMATCH。
      - name: Sync templates
        run: make sync-templates

      - name: Stage plugin examples for the sandbox
        shell: bash  # `cp -r src/. dst` 是 POSIX 语义; Windows runner 缺省 shell 是
                     # pwsh, Copy-Item 对结尾的 `/.` 解析为空拷贝 (CI 实测 data/plugins
                     # 落空 -> GET /api/plugins 19/23 假红)。
        run: |
          mkdir -p data/plugins
          cp -r plugins/examples/. data/plugins/
          ls data/plugins

      - name: API parity vs settings.exe (frozen Go-era baseline)
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/api-parity/run_api_parity.ps1 -Check -Exe config-ui-reactor/target/release/settings.exe
  # 断链护栏一: 「全仓 make 目标可解析」冒烟 (2026-10-07 加)。
  #   背景: Makefile:148 的 check-hooks 说明行漏了行首 `#`, 被 make 当成前置依赖 ⇒
  #   `make check-hooks` / `make check` / `make deploy` 静默停摆 5 天, 而本 workflow
  #   从不调用这些目标 ⇒ 断链在 CI 完全隐形。`-n` 只解析不执行, 成本极低,
  #   却能一次性兜住所有「目标名/依赖拼写」类断链。
  make-parse:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: 'make -n check (parse every prerequisite, no side effects)'
        run: make -n check

  # 断链护栏二: check-hooks 真跑 (AHK 运行时断言 = provider 分发契约)。
  #   与 make-parse 互补: 前者保证「门禁可被调度」, 本 job 保证「门禁真断言到行为」。
  #   bin/AutoHotkey64.exe 已入库, 无需额外准备; 不并入 check 是因为它属回归探针,
  #   不是「随时可跑」的无副作用静态闸门 (见 Makefile 该目标上方注释)。
  check-hooks:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: 'make check-hooks (AHK provider dispatch contract)'
        run: make check-hooks
  # 断链护栏三: 「官方插件两树镜像」闸门 (2026-10-07 加)。
  #   plugins/examples 与 data/plugins 必须逐字节一致: 前者是规范源 (sync-plugins / CI 沙箱 /
  #   cargo 生成器测试都读它), 后者被 .gitignore 反选放行、是发布打包 (copyFiles / release.yml
  #   的 `cp -r data`) 的唯一来源 —— 两树历史上曾静默分叉。为何不整树去重见 Makefile 目标注释。
  check-plugins-mirror:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: 'make check-plugins-mirror (bundled plugin trees must be byte-identical)'
        run: make check-plugins-mirror
