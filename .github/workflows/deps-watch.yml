name: deps-watch

# 上游依赖检测 (多维度优化报告 #7)。
#
# 为什么独立成 workflow（不进 analyzers.yml）：
#   analyzers.yml 是每个 push/PR 都跑的静态闸门；而本 job **需要网络**且只关心
#   "上游是否发了新版"，每周一次足够。放进 push 闸门只会徒增噪音与外部依赖。
#
# 守的是什么：
#   `config-ui-reactor/Cargo.toml` 用 `[patch.crates-io]` 指向本地 fork
#   `vendor/windows-reactor`（P1..P8 补丁）。补丁面对编译器/测试/CI **不可见** ——
#   上游发新版时仓库不会有任何提示，fork 会静默过期。本 job 把"上游已经往前走"变成
#   一次可见的红灯，人去按 `vendor/windows-reactor/PATCHES.md` §四 的 rebase 清单重放补丁。
#
# 注意：本 job **不**自动升版本 / 重放补丁（fork rebase 可能处处冲突，必须人工）。

on:
  schedule:
    # 每周一 03:00 UTC（北京时间 11:00）。
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  upstream-windows-reactor:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 单一真源 = devtools check-upstream-reactor（原 tools/check-upstream-reactor.ps1，
      # 2026-10-08 移植为 Rust）；经 make check-upstream 调用 ⇒ 本 job 需自带 Rust 工具链。
      - name: Setup Rust toolchain (channel = stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & devtools target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            devtools/target
          key: devtools-${{ runner.os }}-${{ hashFiles('devtools/Cargo.lock') }}

      - name: 'Check upstream windows-reactor version (single source: devtools check-upstream-reactor)'
        run: make check-upstream

  # 依赖供应链审计（多维度优化报告 #8）：RUSTSEC 漏洞库 + 许可 / 来源 / 反模式合规。
  #   为什么独立于 push 闸门：需要网络 + 外部 advisory DB，且"新披露漏洞"与本次改动无关，
  #   每周一次即可（与上游版本检测同一节奏，故并入本 workflow）。
  #   单一真源 = devtools check-deps（原 tools/check-deps.ps1，2026-10-08 移植为 Rust；覆盖
  #   config-ui-reactor / command-input / devtools 三个 cargo 工程）；配置单一真源 = 仓库根 deny.toml。
  deps-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install cargo-audit + cargo-deny (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Cache cargo registry & devtools target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            devtools/target
          key: devtools-${{ runner.os }}-${{ hashFiles('devtools/Cargo.lock') }}

      # ubuntu runner 自带 cargo（PATH）⇒ 直接 cargo run，无需 env.ps1（那是本机 MSVC 注入）。
      - name: 'Dependency audit (single source: devtools check-deps)'
        run: cargo run --release --manifest-path devtools/Cargo.toml -- check-deps