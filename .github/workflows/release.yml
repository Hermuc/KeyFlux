name: release

# 打 tag (v*) 才构建并发布正式 Release; workflow_dispatch 用于手动验证构建 (可跳过发布)。
# 产物: KeyFlux-<version>.7z (自包含, 解压即用)。
# 注意: Oracle 对账脚本 (tools/oracle.ps1) 不在 CI 运行 —— 它需要 AutoHotkey 运行时 +
#       一棵**活着的部署树** (被校验的实例不该在被覆盖时持有文件锁), 这两样 CI 都没有;
#       生成契约由 golden 快照测试 + /Validate 覆盖。
#       (2026-09-30: 该脚本内的本机硬编码路径已改为参数/环境变量, 默认值等价 —— 但它仍
#        不属于 CI, 上 CI 需要先解决上面两条, 属独立议题。)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (不含前缀 v; 留空 = 自动取 Makefile 的 version —— 单一真源。批 P 前这里写死 1.0-beta1-dev, 与 Makefile 的 1.0-beta1 分裂)'
        required: false
        default: ''
      skip_release:
        description: '只构建验证, 不发布 Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Derive version (tag v2.0-beta34 -> 2.0-beta34; 手动触发留空则取 Makefile 单一真源)
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # 单一真源 = Makefile:version（与 analyzers.yml api-parity job 的 sed 同口径）
            VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' Makefile | head -1)"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "version from Makefile: ${VERSION}"
          fi

      # (2026-10-06 Go 后端退役) settings.exe 由 cargo 直接产出 (config-ui-reactor
      # 的 bin 目标 settings), 版本注入走 KEYFLUX_VERSION (对齐 Go 时代的 ldflags 注入口径
      # —— GET /config 的 keyfluxVersion 与发布版本号一致)。
      # 自包含: build.rs 的 as_self_contained() 把 pinned Windows App Runtime stage 进
      # target/release, robocopy 排除 cargo 中间产物后整体拷入 bin/ui (实测 207 文件 / 65MB)。
      - name: Build reactor UI + settings.exe (cargo gates + release)
        shell: pwsh
        env:
          KEYFLUX_VERSION: ${{ steps.ver.outputs.version }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/cargo-gates.ps1 -Release -Version "${{ steps.ver.outputs.version }}"

      - name: Deploy settings.exe (CLI/backend, drop-in)
        shell: pwsh
        run: |
          Copy-Item "config-ui-reactor/target/release/settings.exe" "bin/settings.exe" -Force
          if (!(Test-Path "bin/settings.exe")) { Write-Error "missing bin/settings.exe"; exit 1 }
          Write-Host "[OK] settings.exe (Rust) -> bin/"

      - name: Generate + validate AHK script (/Validate)
        run: |
          bin/settings.exe GenerateAHK ./data/config.json ./templates/keyflux.tmpl ./bin/KeyFlux.ahk
          MSYS_NO_PATHCONV=1 bin/AutoHotkey64.exe /ErrorStdOut /Validate ./bin/KeyFlux.ahk

      # 单一真源 = Makefile sync-templates（批 P：此前这里内联 `rm -rf` + `cp -r`，与
      # Makefile 配方逐字重复 —— 同步口径一旦变化必然漏改这一份；analyzers.yml 早已走 make）
      - name: Sync templates
        run: make sync-templates

      - name: Deploy reactor UI to bin/ui (self-contained, renamed)
        shell: pwsh
        run: |
          $src = (Resolve-Path "config-ui-reactor/target/release").Path
          $dst = "bin/ui"
          # Exclude set + robocopy step come from tools/lib/kf-tools.ps1 (single
          # source -- it used to be copied verbatim in three places).
          . ./tools/lib/kf-tools.ps1
          $code = Invoke-KfReactorStaging -Source $src -Destination $dst
          if ($code -ge 8) { Write-Error "robocopy exit $code"; exit 1 }
          Copy-Item "$src/keyflux-settings.exe" "$dst/KeyFlux.Settings.exe" -Force
          if (!(Test-Path "$dst/KeyFlux.Settings.exe")) { Write-Error "missing bin/ui/KeyFlux.Settings.exe"; exit 1 }
          Write-Host ("[OK] reactor client -> bin/ui: " + (Get-ChildItem $dst -Recurse -File | Measure-Object).Count + " files")

      # 部署「双腿」一致性 (多维度优化报告 #6): 后端 bin/settings.exe 与面板
      # bin/ui/KeyFlux.Settings.exe 必须各自 == 其 target/release 源, 且两者互不相等。
      # 单一真源 = devtools verify-deploy (原 tools/verify_deploy.ps1, 2026-10-08 移植为 Rust; 经 make verify-deploy)。放在打包**之前**,
      # 防止把某条腿悄悄变旧的产物打进发布包 —— 这正是历史上翻车过多次的失败面。
      # leg C (命令框 exe) 也是随包产物, 但此前 release.yml **不构建它** —— 若仓库那份
      # bin/KeyFlux-CommandInput.exe 不是当前源码的构建, 发布包就会带旧命令框 (Makefile
      # `command-input` 目标注释记录过该事故)。这里显式重建, 让 verify-deploy 的 leg C
      # 在发布链里**真正生效**(否则它是 optional leg, 缺产物只 skip)。
      - name: Build command-input (fresh, so leg C is enforced)
        run: make command-input

      - name: Verify deploy legs (built == staged, and the legs differ)
        run: make verify-deploy

      - name: Stamp version into sample config
        working-directory: bin
        # ⚠ 双份实现（Makefile `build` 目标内 `cd bin; ./settings.exe ChangeVersion` 同款配方）
        # —— 改任一处须同步另一处。收编为 make 目标
        # 评估过：CI 在 bin/ 下按相对名调用、working-directory 语义不同，暂不收编。
        run: ./settings.exe ChangeVersion "${{ steps.ver.outputs.version }}"

      - name: Assemble release folder
        shell: bash
        run: |
          FOLDER="KeyFlux-${{ steps.ver.outputs.version }}"
          rm -rf "$FOLDER"
          mkdir -p "$FOLDER/shortcuts"
          rm -rf bin/site && cp -r site-assets bin/site
          cp -r data "$FOLDER/"
          cp -r bin "$FOLDER/"
          cp -r tools "$FOLDER/"
          rm -f "$FOLDER/tools/oracle.ps1"
          cp KeyFlux.exe "$FOLDER/"
          cp -- *.bat "$FOLDER/"

      - name: Install 7-Zip
        run: choco install 7zip -y --no-progress

      - name: Pack 7z
        shell: bash
        run: |
          SEVENZIP="$(command -v 7z.exe || echo '/c/Program Files/7-Zip/7z.exe')"
          "$SEVENZIP" a "KeyFlux-${{ steps.ver.outputs.version }}.7z" "KeyFlux-${{ steps.ver.outputs.version }}"

      - name: Upload build artifact (workflow_dispatch 验证用)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: KeyFlux-${{ steps.ver.outputs.version }}
          path: KeyFlux-*.7z

      - name: Publish release
        if: ${{ github.event_name == 'push' || inputs.skip_release == false }}
        uses: softprops/action-gh-release@v2
        with:
          files: KeyFlux-*.7z
          generate_release_notes: true
