name: release

# 打 tag (v*) 才构建并发布正式 Release; workflow_dispatch 用于手动验证构建 (可跳过发布)。
# 产物: KeyFlux-<version>.7z (自包含, 解压即用)。
# 注意: Oracle 对账脚本 (tools/oracle.ps1) 内含本机硬编码路径, 不在 CI 运行;
#       生成契约由 golden 快照测试 + /Validate 覆盖。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (不含前缀 v, 如 2.0-beta34)'
        required: false
        default: '1.0-beta1-dev'
      skip_release:
        description: '只构建验证, 不发布 Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Derive version (tag v2.0-beta34 -> 2.0-beta34)
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: config-server/go.mod
          cache-dependency-path: config-server/go.sum

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Go unit tests
        working-directory: config-server
        run: go test ./...

      - name: Build settings.exe (version injected via ldflags)
        run: |
          go build -C ./config-server -tags=nomsgpack \
            -ldflags "-s -w -X settings/internal/script.KeyfluxVersion=${{ steps.ver.outputs.version }}" \
            -o ../bin/settings.exe ./cmd/settings

      - name: Stage headless backend for C# endpoint tests
        shell: bash
        run: |
          mkdir -p "$TEMP/mk_settings_headless"
          cp bin/settings.exe "$TEMP/mk_settings_headless/settings.exe"

      # (2026-09-28) 原 C# 单测步骤随 config-ui-avalonia 退役;
      #   等价契约覆盖在 config-ui-reactor 的 cargo 单测中 (见下方 Rust client gates)。

      - name: Generate + validate AHK script (/Validate)
        run: |
          bin/settings.exe GenerateAHK ./data/config.json ./config-server/templates/keyflux.tmpl ./bin/KeyFlux.ahk
          MSYS_NO_PATHCONV=1 bin/AutoHotkey64.exe /ErrorStdOut /Validate ./bin/KeyFlux.ahk

      - name: Sync templates (buildServer 后半段)
        run: |
          rm -rf bin/templates
          cp -r config-server/templates bin/templates

      # 2026-09-28 Avalonia 退役: 设置界面改由 config-ui-reactor (Rust + WinUI3) 提供。
      # 三道闸门与 Makefile 的 buildClientReactor 严格一致; 产物必须改名
      # KeyFlux.Settings.exe (引擎按该名拉起, 见 bin/lib/core/Functions.ahk)。
      # 自包含: build.rs 的 as_self_contained() 把 pinned Windows App Runtime stage 进
      # target/release, robocopy 排除 cargo 中间产物后整体拷入 bin/ui (实测 207 文件 / 65MB)。
      - name: Build reactor UI (fmt + clippy + test + release)
        shell: pwsh
        working-directory: config-ui-reactor
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo clippy --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo test --quiet
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo build --release
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Deploy reactor UI to bin/ui (self-contained, renamed)
        shell: pwsh
        run: |
          $src = (Resolve-Path "config-ui-reactor/target/release").Path
          $dst = "bin/ui"
          robocopy $src $dst /E /XD .fingerprint build deps examples incremental /XF *.pdb *.d *.cargo-lock *.cargo-build-lock *.cargo-artifact-lock keyflux-settings.exe | Out-Null
          if ($LASTEXITCODE -ge 8) { Write-Error "robocopy exit $LASTEXITCODE"; exit 1 }
          Copy-Item "$src/keyflux-settings.exe" "$dst/KeyFlux.Settings.exe" -Force
          if (!(Test-Path "$dst/KeyFlux.Settings.exe")) { Write-Error "missing bin/ui/KeyFlux.Settings.exe"; exit 1 }
          Write-Host ("[OK] reactor client -> bin/ui: " + (Get-ChildItem $dst -Recurse -File | Measure-Object).Count + " files")

      - name: Stamp version into sample config
        working-directory: bin
        run: ./settings.exe ChangeVersion "${{ steps.ver.outputs.version }}"

      - name: Assemble release folder
        shell: bash
        run: |
          FOLDER="KeyFlux-${{ steps.ver.outputs.version }}"
          rm -rf "$FOLDER"
          mkdir -p "$FOLDER/shortcuts"
          rm -rf bin/site && cp -r site-assets bin/site
          cp -r data "$FOLDER/"
          cp -r bin "$FOLDER/"
          cp -r tools "$FOLDER/"
          rm -f "$FOLDER/tools/oracle.ps1"
          cp KeyFlux.exe "$FOLDER/"
          cp -- *.bat "$FOLDER/"

      - name: Install 7-Zip
        run: choco install 7zip -y --no-progress

      - name: Pack 7z
        shell: bash
        run: |
          SEVENZIP="$(command -v 7z.exe || echo '/c/Program Files/7-Zip/7z.exe')"
          "$SEVENZIP" a "KeyFlux-${{ steps.ver.outputs.version }}.7z" "KeyFlux-${{ steps.ver.outputs.version }}"

      - name: Upload build artifact (workflow_dispatch 验证用)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: KeyFlux-${{ steps.ver.outputs.version }}
          path: KeyFlux-*.7z

      - name: Publish release
        if: ${{ github.event_name == 'push' || inputs.skip_release == false }}
        uses: softprops/action-gh-release@v2
        with:
          files: KeyFlux-*.7z
          generate_release_notes: true
