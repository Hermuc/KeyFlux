[package]
name = "config-ui-reactor"
version = "1.0.0"          # 与 KeyFlux 版本联动（构建溯源用）
edition = "2024"           # 与官方 windows-reactor 样例一致
publish = false

[[bin]]
# ⚠️ Cargo 的 bin 名不允许含 '.'，故此处用连字符；**部署阶段必须重命名为
#    KeyFlux.Settings.exe**（引擎按该文件名拉起设置面板，见 bin/ 侧引用）。
name = "keyflux-settings"
path = "src/main.rs"

[[bin]]
# P3：Rust 版 `settings.exe`（drop-in 替代 Go）。**增量实现** —— 未实现的子命令显式报错。
# 与面板 bin 并列，故 Makefile 的 robocopy 必须把它排除在 bin/ui 之外（否则会误入部署的 UI 目录）。
name = "settings"
path = "src/bin/settings.rs"

[[bin]]
# 发布运维 CLI：原 `scripts/build_tools.go` 的 Rust 移植（Go 工具链已于 2026-10-07 退役）。
# 逻辑在 lib（services/build_tools.rs，带单测），本 bin 只做 argv → 退出码映射。
# ⚠️ 产物 build-tools.exe 与 settings.exe 同在 target/release ⇒ 三处 robocopy（Makefile /
#    tools/deploy_panel.ps1 / .github/workflows/release.yml）的 /XF 必须排除它，
#    否则会被拷进部署的 bin/ui 目录。
name = "build-tools"
path = "src/bin/build_tools.rs"

[lib]
# P3（Rust 迁移）起 crate = lib + bin：
# * lib 承载面板各层（app/models/platform/services/theme/ui），并作为后续 **Rust 生成器**
#   （同名 settings.exe drop-in）的落点 —— 生成器要被 bin 与单测共享，放 bin 里会因
#   "未被引用的 pub 项" 触发 dead_code，而 `clippy -D warnings` 是闸门。
# * bin `keyflux-settings` 仍是唯一二进制入口（`src/main.rs`，保留 GUI 子系统属性）。
name = "config_ui_reactor"
path = "src/lib.rs"

[dependencies]
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# R1「面板后端 HTTP 服务模式」（settings.exe --headless）：轻量 HTTP/1.1 服务端，
# 支持 keep-alive 与并发连接，替代 Go gin 的最小子集（/health /config /server/command/:id）。
tiny_http = "0.12"
# R2 插件导入（POST /api/plugins/import）：解包 zip 到临时目录再原子落盘。
# 只开 deflate（Go archive/zip 同样只支持 store/deflate），关掉默认的全部加密/压缩特性。
zip = { version = "2", default-features = false, features = ["deflate"] }
# platform-verifier: 市场目录走系统证书库（Windows 证书存储）——内置 webpki-roots
# 不含用户安装的代理/企业根，国内网络下 raw.githubusercontent 被劫持时恒报
# UnknownIssuer（2026-10-02 实测）。跟随 OS 信任库 = git/curl 同行为。
ureq = { version = "3.4.2", features = ["platform-verifier"] }
windows-reactor = "0.100"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# vendor 补丁（2026-09-28）：上游 0.100.0 无字体通道（无 font_family builder /
# ResourceOverrides 仅色值 / AppContext 不暴露 Resources），fork 在装完 Fluent
# 资源后经 XamlReader 覆盖 ContentControlThemeFontFamily 全局字体键（MiSans）。
# 补丁面与升级步骤见 vendor/windows-reactor/PATCHES.md —— 该文件是**唯一清单**，
# 勿在此处重复维护（历史教训：本注释曾停留在 P1 时代，P2~P5 一直没写进来）。
[patch.crates-io]
windows-reactor = { path = "vendor/windows-reactor" }

[build-dependencies]
windows-reactor-setup = "0.100"   # 自包含部署：staging Windows App Runtime

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
# 函数长度门禁（多维度优化报告 #12）：clippy 的 pedantic 项，阈值 = clippy.toml 的
# too-many-lines-threshold（默认 100）。存量超长者就地 `#[expect(clippy::too_many_lines,
# reason = "…")]` 登记 —— 与「移除 crate 级 allow(dead_code)」同一策略：expect 会在该项将来
# 变短时报 unfulfilled_lint_expectations 迫使清理，allow 不会。
too_many_lines = "warn"
